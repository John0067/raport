<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6d9c4">
<title>{{TITLE}}</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg1:#fdf0e3; --bg2:#e6f2f6; --card:rgba(255,255,255,.72); --ink:#3b4852; --muted:#7a8892;
  --accent:#6fae9a; --accent2:#e9a98c; --line:rgba(80,100,110,.12); --up:#d98a6c; --down:#5b9f88;
  --chip:#eef6f3; --shadow:0 8px 28px rgba(110,130,140,.14);
}
body.evening{ --bg1:#ece4f6; --bg2:#fbe6ea; --accent:#9a86c9; --accent2:#e8a0b4; --chip:#f2edf9; }
@media (prefers-color-scheme: dark){
  :root{ --bg1:#1d2a33; --bg2:#26303f; --card:rgba(255,255,255,.07); --ink:#e6edf0; --muted:#9aaab4;
         --line:rgba(255,255,255,.1); --chip:rgba(255,255,255,.08); --shadow:0 8px 28px rgba(0,0,0,.25); --up:#f0a58a; --down:#7cc4aa; }
  body.evening{ --bg1:#241f38; --bg2:#33243a; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); min-height:100vh;
  font-family: ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  line-height:1.5; background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 40px}
header{padding:18px 4px 6px}
header h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-.5px}
header .date{font-size:17px;color:var(--muted);margin-top:2px}
.thought{display:inline-block;margin:14px 0 6px;padding:10px 16px;background:var(--card);border-radius:999px;
  box-shadow:var(--shadow);font-size:15px}
.grid{display:grid;gap:16px;margin:14px 0}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);margin:14px 0}
.grid .card{margin:0}
h2{margin:0 0 8px;font-size:20px}
h2.sec{margin:30px 4px 4px;font-size:22px}
h3{margin:16px 0 6px;font-size:15px;color:var(--accent);text-transform:none;letter-spacing:.2px}
h3.first{margin-top:0;font-size:17px}
.muted{color:var(--muted);font-size:14px;margin:6px 0}
.tiny{font-size:12px}
.now{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-size:44px;font-weight:800}
.desc{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips span{background:var(--chip);border-radius:999px;padding:4px 12px;font-size:14px}
ul{margin:6px 0;padding:0;list-style:none}
ul.dress li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
ul.dress li:last-child{border:0}
ul.dress li span{font-size:20px;line-height:1.3}
ul.plain li,ul.events li{padding:5px 0;border-bottom:1px dashed var(--line)}
ul.plain li:last-child,ul.events li:last-child{border:0}
ul.news li{padding:8px 0;border-bottom:1px dashed var(--line)}
ul.news li:last-child{border:0}
ul.news a{color:var(--ink);text-decoration:none;font-weight:600}
ul.news a:hover{color:var(--accent);text-decoration:underline}
.src{display:block;font-size:12px;color:var(--muted)}
.fx .fxl{color:var(--muted);font-size:14px}
.fx .fxv{font-size:32px;font-weight:800}
.fx .fxv small{font-size:15px;font-weight:600;color:var(--muted)}
.fxd{font-size:13px}.fxd.up{color:var(--up)}.fxd.down{color:var(--down)}.fxd.flat{color:var(--muted)}
.spark{display:block;margin:8px 0 4px;color:var(--accent);width:100%;height:auto;max-width:200px}
form{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
input{flex:1;min-width:150px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--chip);color:var(--ink);font:inherit}
button{padding:10px 18px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
footer{margin-top:34px;text-align:center;color:var(--muted);font-size:12px}
@media (max-width:520px){.big{font-size:38px}.card{padding:16px}}
</style>
</head>
<body class="{{EDITION}}">
<div class="wrap">
  <header>
    <h1>{{GREETING}}</h1>
    <div class="date">{{DATE}}</div>
    <div class="thought">{{THOUGHT}}</div>
  </header>
  {{SECTIONS}}
  <footer>{{FOOTER}}</footer>
</div>
<script>
(function(){
  var lock = document.getElementById('cal-lock');
  if(!lock) return;
  var enc = JSON.parse(lock.getAttribute('data-enc'));
  var form = document.getElementById('cal-form'), pw = document.getElementById('cal-pw');
  var err = document.getElementById('cal-err'), open = document.getElementById('cal-open');
  function b64(s){ return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0)}); }
  async function tryOpen(p){
    var te = new TextEncoder();
    var km = await crypto.subtle.importKey('raw', te.encode(p), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(enc.salt), iterations:enc.iter, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, b64(enc.ct));
    open.innerHTML = new TextDecoder().decode(pt);
    open.hidden = false; lock.hidden = true;
  }
  form.addEventListener('submit', async function(e){
    e.preventDefault(); err.textContent = '';
    try { await tryOpen(pw.value); try{localStorage.setItem('raport_pw', pw.value)}catch(_){} }
    catch(_){ err.textContent = 'Parolă greșită 🙈 Mai încearcă.'; }
  });
  try{ var saved = localStorage.getItem('raport_pw'); if(saved){ tryOpen(saved).catch(function(){}); } }catch(_){}
})();
</script>
</body>
</html>
