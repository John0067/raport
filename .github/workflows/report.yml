name: Raport zilnic

on:
  schedule:
    # Ora 06:20, 13:00 și 16:50 în Cehia/România (ora de vară și ora de iarnă).
    # Șase cron-uri; garda de mai jos decide după ora locală reală, nu după cron.
    - cron: '20 4 * * *'
    - cron: '20 5 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '50 14 * * *'
    - cron: '50 15 * * *'
  workflow_dispatch:   # buton „Run workflow” pentru rulare manuală oricând

permissions:
  contents: write

concurrency:
  group: raport
  cancel-in-progress: false

jobs:
  raport:
    runs-on: ubuntu-latest
    steps:
      - name: Decide dacă rulăm acum (ora de vară / iarnă)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          CRON_NAME: ${{ github.event.schedule }}
          REPO: ${{ github.repository }}
        run: |
          H=$(TZ=Europe/Prague date +%H)
          H=$((10#$H))
          RUN=yes
          AGE=n/a
          if [ "$EVENT_NAME" = "schedule" ]; then
            RUN=no
            if { [ "$H" -ge 6 ] && [ "$H" -lt 8 ]; } || { [ "$H" -ge 13 ] && [ "$H" -lt 15 ]; } || { [ "$H" -ge 16 ] && [ "$H" -lt 18 ]; }; then
              LAST=$(gh api "repos/$REPO/commits/gh-pages" --jq .commit.committer.date 2>/dev/null) || LAST=""
              case "$LAST" in 20??-??-??T*Z) ;; *) LAST=1970-01-01T00:00:00Z ;; esac
              AGE=$(( $(date +%s) - $(date -d "$LAST" +%s) ))
              if [ "$AGE" -gt 10800 ]; then RUN=yes; fi
            fi
          fi
          echo "event=$EVENT_NAME cron='$CRON_NAME' ora_Praga=${H}h ultima_publicare_acum=${AGE}s -> run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalează dependențele
        if: steps.gate.outputs.run == 'yes'
        run: pip install -r requirements.txt

      - name: Generează raportul
        if: steps.gate.outputs.run == 'yes'
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          H=$(TZ=Europe/Prague date +%H)
          if [ "$((10#$H))" -lt 15 ]; then ED=morning; else ED=evening; fi
          python run_report.py --edition "$ED"

      - name: Publică pagina (ramura gh-pages)
        if: steps.gate.outputs.run == 'yes'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

      - name: Trimite notificare pe telefon
        if: steps.gate.outputs.run == 'yes'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          PAGE_URL="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          [ -n "$NTFY_TOPIC" ] || { echo "NTFY_TOPIC nesetat – sar peste notificare"; exit 0; }
          H=$(TZ=Europe/Prague date +%H)
          if [ "$((10#$H))" -lt 15 ]; then T="☕ Raportul de zi e gata"; else T="🌙 Raportul de seară e gata"; fi
          jq -n --arg topic "$NTFY_TOPIC" --arg title "$T" --arg msg "$(cat site/summary.txt)" --arg url "$PAGE_URL" \
            '{topic:$topic,title:$title,message:$msg,click:$url,tags:["coffee"],actions:[{action:"view",label:"Deschide",url:$url}]}' \
            | curl -sf -H "Content-Type: application/json" -d @- https://ntfy.sh
